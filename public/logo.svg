<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="qRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background squircle container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Stylized "Q" circular ring (Attendance Progress Ring) -->
  <circle cx="62" cy="58" r="32" fill="none" stroke="url(#qRingGrad)" stroke-width="9.5" stroke-linecap="round" stroke-dasharray="162 42" stroke-dashoffset="-12" filter="url(#glow)"/>

  <!-- Attendance Checkmark inside the Q (Present status) -->
  <path d="M47 58 L57 68 L77 46" fill="none" stroke="url(#checkGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Dynamic Q Tail sweeping downward-right -->
  <path d="M71 69 L93 91" fill="none" stroke="url(#tailGrad)" stroke-width="9.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Live Alert Pulse Dot (Top-Right) -->
  <circle cx="95" cy="33" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="95" cy="33" r="8.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
