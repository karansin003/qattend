<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — QAttend</title>
  <meta name="description" content="Login to QAttend to view your QUMS attendance and manage your Telegram notifications." />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="modulepreload" href="/firebase-config.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
</head>
<body>
  <div class="auth-bg auth-white">
    <div class="auth-card">
      <div class="auth-brand"><img src="/logo.svg" alt="QAttend Logo" class="brand-logo" width="28" height="28" /> QAttend</div>
      <p class="auth-tagline">Track. Alert. Stay Updated.</p>
      <h1>Welcome back</h1>
      <div class="sub">Login to your QAttend account.</div>
      <form id="login-form" novalidate>
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@example.com" autocomplete="username" required />
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" data-target="password" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="error" class="form-error hidden" role="alert" aria-live="polite"></div>
        <div style="margin-top: 18px;"><button id="btn" type="submit" style="width: 100%;">Login</button></div>
      </form>
      <div class="auth-foot" style="margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 0.875rem;">
        <div>Don't have an account? <a href="/register">Register</a></div>
        <div><a href="/forgot">Forgot Password?</a></div>
        <div><a href="/">← Back to Home</a></div>
      </div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);

    /*
     * FIREBASE AUTHENTICATION (Web SDK)
     * Pre-warmed immediately in parallel so by the time credentials are typed,
     * the SDK is already loaded and ready in memory with 0 network latency.
     */
    let firebaseSdkPromise = null;

    function loadFirebase() {
      if (!firebaseSdkPromise) {
        firebaseSdkPromise = (async () => {
          const { firebaseConfig } = await import('/firebase-config.js');
          const [appMod, authMod] = await Promise.all([
            import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
            import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
          ]);
          const app = appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(firebaseConfig);
          return {
            auth: authMod.getAuth(app),
            signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
          };
        })().catch((err) => {
          console.warn('Firebase init error:', err);
          firebaseSdkPromise = null;
          throw err;
        });
      }
      return firebaseSdkPromise;
    }

    // Warm up Firebase in background immediately
    loadFirebase().catch(() => {});

    function firebaseLoginErrorMessage(error) {
      switch ((error && error.code) || '') {
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          return 'wrong email or password.';
        case 'auth/invalid-email':
          return 'Please enter a valid email address.';
        case 'auth/user-disabled':
          return 'This account has been disabled. Please contact the administrator.';
        case 'auth/too-many-requests':
          return 'Too many attempts. Please wait a while and try again.';
        case 'auth/network-request-failed':
          return 'Network problem. Please check your internet connection.';
        default:
          return 'Login failed. Please try again.';
      }
    }

    let isSubmitting = false;

    async function submit() {
      if (isSubmitting) return;

      const email = $('email').value.trim().toLowerCase();
      const password = $('password').value;

      if (!email) {
        $('error').textContent = 'Please enter your email.';
        $('error').classList.remove('hidden');
        $('email').focus();
        return;
      }
      if (!password) {
        $('error').textContent = 'Please enter your password.';
        $('error').classList.remove('hidden');
        $('password').focus();
        return;
      }

      isSubmitting = true;
      const btn = $('btn');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Logging in...';
      $('error').classList.add('hidden');

      /*
       * STEP 1 — Authenticate with Firebase (password stays in the browser).
       * Legacy users created before Firebase integration are still supported:
       * if Firebase does not know the account, the backend bcrypt fallback runs.
       */
      let idToken = null;
      let credential = null;
      try {
        const fb = await loadFirebase();
        credential = await fb.signInWithEmailAndPassword(fb.auth, email, password);
        idToken = await credential.user.getIdToken();
      } catch (fbError) {
        const code = (fbError && fbError.code) || '';
        if (code.startsWith('auth/')) {
          // Could be a pre-Firebase legacy account not yet in Firebase — let
          // the backend's bcrypt fallback decide instead of erroring out now.
          if (!['auth/user-not-found', 'auth/invalid-credential', 'auth/wrong-password'].includes(code)) {
            $('error').textContent = firebaseLoginErrorMessage(fbError);
            $('error').classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = originalText;
            isSubmitting = false;
            return;
          }
        } else {
          console.warn('Firebase SDK unavailable, using legacy login:', fbError);
        }
      }

      /*
       * STEP 2 — Backend verifies the ID token (or runs the bcrypt fallback)
       * and creates the existing Express session.
       */
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          // password accompanies the token ONLY as ownership proof for linking
          // a pre-Firebase account — the backend never stores it.
          body: JSON.stringify(idToken ? { email, idToken, password } : { email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          $('error').textContent = data.error || 'Login fail';
          $('error').classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = originalText;
          isSubmitting = false;
          return;
        }
        const target = data.redirect || (credential && credential.user && !credential.user.emailVerified ? '/verify-email' : '/dashboard');
        window.location.replace(target);
      } catch (err) {
        $('error').textContent = err.message || 'Login failed. Please try again.';
        $('error').classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = originalText;
        isSubmitting = false;
      }
    }

    // Form submit listener (captures Enter key and submit button)
    $('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      submit();
    });

    // Enter key handling on input fields for instant response
    $('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!$('password').value) {
          $('password').focus();
        } else {
          submit();
        }
      }
    });

    $('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });

    // Clear error message when user modifies inputs
    $('email').addEventListener('input', () => $('error').classList.add('hidden'));
    $('password').addEventListener('input', () => $('error').classList.add('hidden'));

    // password show/hide toggle with clean SVG icons (no weird emoji)
    const EYE_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    document.querySelectorAll('.pw-toggle').forEach((b) =>
      b.addEventListener('click', () => {
        const el = document.getElementById(b.dataset.target);
        if (!el) return;
        const isPw = el.type === 'password';
        el.type = isPw ? 'text' : 'password';
        b.innerHTML = isPw ? EYE_OFF_SVG : EYE_SVG;
        b.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
      })
    );
  </script>
</body>
</html>
