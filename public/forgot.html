<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — QUMS Attendance Bot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <h1>🔑 Forgot Password</h1>
      <div class="sub">Enter your registered email to receive a password reset link.</div>
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" type="email" placeholder="tum@example.com" />
      <div id="msg" class="form-ok hidden"></div>
      <div id="error" class="form-error hidden"></div>
      <div style="margin-top: 18px;"><button id="btn" style="width: 100%;">Generate Reset Link</button></div>
      <div class="auth-foot"><a href="/login">← back to login</a></div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    $('btn').addEventListener('click', async () => {
      const btn = $('btn'); btn.disabled = true;
      $('error').classList.add('hidden'); $('msg').classList.add('hidden');
      try {
        const res = await fetch('/api/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value.trim() }),
        });
        const data = await res.json();
        $('msg').textContent = data.message || (data.ok ? 'Reset link ban gaya.' : '');
        $('msg').classList.remove('hidden');
      } catch (err) {
        $('error').textContent = err.message; $('error').classList.remove('hidden');
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
