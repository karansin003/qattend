<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — QUMS Attendance Bot</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="modulepreload" href="/firebase-config.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <h1>🔑 Forgot Password</h1>
      <div class="sub">Enter your registered email to receive a password reset link.</div>
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" type="email" placeholder="tum@example.com" />
      <div id="msg" class="form-ok hidden"></div>
      <div id="error" class="form-error hidden"></div>
      <div style="margin-top: 18px;"><button id="btn" style="width: 100%;">Send Reset Email</button></div>
      <div class="auth-foot"><a href="/login">← back to login</a> · <a href="/register">create a new account</a></div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);

    /*
     * FIREBASE — password-reset email is sent by Firebase Authentication
     * (public web config only). The backend first confirms the email belongs
     * to a registered application user; unregistered emails get no email.
     */
    async function sendFirebaseResetEmail(email) {
      const { firebaseConfig } = await import('/firebase-config.js');
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
      const app = appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(firebaseConfig);
      const auth = authMod.getAuth(app);
      await authMod.sendPasswordResetEmail(auth, email);
    }

    $('btn').addEventListener('click', async () => {
      const btn = $('btn'); btn.disabled = true;
      $('error').classList.add('hidden'); $('msg').classList.add('hidden');
      const email = $('email').value.trim().toLowerCase();
      let backendRegistered = false;
      try {
        /*
         * STEP 1 — backend: is this email a registered application user?
         * Unregistered -> explicit error, NO reset email is sent.
         */
        const check = await fetch('/api/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email }),
        });
        const checkData = await check.json().catch(() => ({}));
        backendRegistered = Boolean(checkData.registered);
        if (!check.ok || !checkData.registered) {
          $('error').textContent =
            checkData.error ||
            '❌ This email is not registered.\nPlease check your email address or create a new account.';
          $('error').classList.remove('hidden');
          return;
        }

        /*
         * STEP 2 — registered: Firebase sends the reset email to the USER'S
         * OWN address (continueUrl brings them back to our /reset page).
         */
        await sendFirebaseResetEmail(email);
        $('msg').textContent = 'Password reset email sent. Please check your inbox.';
        $('msg').classList.remove('hidden');
      } catch (err) {
        const code = (err && err.code) || '';
        if (code === 'auth/user-not-found' && backendRegistered) {
          // Registered in the app but not yet linked to Firebase (legacy user).
          $('error').textContent =
            'This email is registered, but not yet linked to Firebase sign-in.\nPlease login once with your current password — the account links automatically — then you can reset your password.';
        } else if (code === 'auth/user-not-found') {
          $('error').textContent =
            '❌ This email is not registered.\nPlease check your email address or create a new account.';
        } else if (code === 'auth/too-many-requests') {
          $('error').textContent = 'Too many requests. Please wait a while and try again.';
        } else {
          $('error').textContent =
            'Could not send the reset email right now. Please try again shortly.';
        }
        $('error').classList.remove('hidden');
        console.error('forgot-password error:', code || err.message);
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
